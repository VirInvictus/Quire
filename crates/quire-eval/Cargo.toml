[package]
name = "quire-eval"
description = "Sheet model and calculator semantics for Quire, a Soulver-style notepad"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# The unit engine behind spec.md "Unit expressions". Network
# fetching and plotting stay off: no numbat code here reaches the
# network, and the plotly dependency never enters the tree.
numbat = { version = "1.24", default-features = false }
