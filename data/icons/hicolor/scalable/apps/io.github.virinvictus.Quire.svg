<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Quire: one sheet, prose lines in blue, the answers column
       right-aligned in yellow. -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="#181616"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="none" stroke="#282727" stroke-width="2"/>
  <!-- the sheet -->
  <rect x="48" y="36" width="160" height="184" rx="12" fill="#23211f"/>
  <rect x="48" y="36" width="160" height="184" rx="12" fill="none" stroke="#43423e" stroke-width="2"/>
  <!-- answers column hairline -->
  <line x1="158" y1="36" x2="158" y2="220" stroke="#43423e" stroke-width="2"/>
  <!-- line 1: math + answer -->
  <rect x="66" y="66" width="70" height="13" rx="6" fill="#8ba4b0"/>
  <rect x="168" y="66" width="26" height="13" rx="6" fill="#c4b28a"/>
  <!-- line 2 -->
  <rect x="66" y="102" width="52" height="13" rx="6" fill="#8ba4b0"/>
  <rect x="160" y="102" width="34" height="13" rx="6" fill="#c4b28a"/>
  <!-- heading line -->
  <rect x="66" y="138" width="80" height="13" rx="6" fill="#c5c9c5"/>
  <!-- total -->
  <rect x="66" y="174" width="58" height="13" rx="6" fill="#87a987"/>
  <rect x="164" y="174" width="30" height="13" rx="6" fill="#c4b28a"/>
</svg>
